<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deadshot Extension</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #ef4444;
      letter-spacing: 0.5px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-export {
      background-color: #ef4444;
      color: #ffffff;
    }
    .btn-export:hover {
      background-color: #dc2626;
    }
    .btn-import {
      background-color: #3b82f6;
      color: #ffffff;
    }
    .btn-import:hover {
      background-color: #2563eb;
    }
    input[type="file"] {
      display: none;
    }
    #status {
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
      font-weight: 500;
    }
    .success { color: #10b981; }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🎯 DEADSHOT</div>
    <span style="font-size: 11px; color: #94a3b8;">v1.0</span>
  </div>

  <div class="card">
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">Export Session Data</p>
    <button id="btnExport" class="btn btn-export">
      📥 Export Session (JSON)
    </button>
  </div>

  <div class="card">
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">Import Session Data</p>
    <button id="btnImportTrigger" class="btn btn-import">
      📤 Import Session (JSON)
    </button>
    <input type="file" id="fileInput" accept=".json">
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
